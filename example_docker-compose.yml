services:
  headless-game-server-steam:
    image: ghcr.io/crowz-fx/headless-game-server-steam:latest
    container_name: headless-game-server-steam
    network_mode: service:zerotier
    environment:
      - SLEEP_TIME=20
      - GAME_RUN_COMMAND=sleep 100000000
    volumes:
      - <changeme>/game:/home/ubuntu/.wine/drive_c/users/ubuntu/Documents/<game>:rw
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 4gb
        reservations:
          cpus: 1
          memory: 2gb
  zerotier:
    container_name: zerotier
    image: zerotier/zerotier:latest
    network_mode: host
    restart: unless-stopped
    privileged: true
    environment:
      - ZEROTIER_JOIN_NETWORKS=<changeme>
    volumes:
      - <changeme>/zerotier:/var/lib/zerotier-one
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun
    healthcheck:
      test:
        - CMD-SHELL
        - zerotier-cli info || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
